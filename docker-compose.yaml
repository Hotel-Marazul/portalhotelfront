services:
  frontend-marazul:
    image: node:22-slim
    container_name: frontend-marazul
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/frontend/node_modules
      - /app/frontend/.next
    command: sh -c "npm install && npm run dev:docker"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - AGENTS_API_URL=http://agents-marazul:5050
    depends_on:
      - backend-marazul
    stdin_open: true
    tty: true
    networks:
      - default

  backend-marazul:
    image: node:22-slim
    container_name: backend-marazul
    working_dir: /app/backend
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/backend/node_modules
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - AUTH_COOKIE_NAME=auth_token
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      - DB_HOST=db-marazul
      - DB_PORT=5432
      - DB_NAME=portal_hotel
      - DB_USER=${DB_USER:?DB_USER is required. Copy .env.compose.example to .env and set a value.}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.compose.example to .env and set a value.}
    depends_on:
      - db-marazul
    stdin_open: true
    tty: true
    networks:
      - default

  agents-marazul:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: agents-marazul
    working_dir: /app/agents
    ports:
      - "5051:5050"
    volumes:
      - ./agents:/app/agents
    command: sh -c "python -m app.server"
    environment:
      - NODE_ENV=development
      - AGENTS_PORT=5050
      - BACKEND_BASE_URL=http://backend-marazul:5000/api
      - BACKEND_BEARER_TOKEN=${BACKEND_BEARER_TOKEN:?BACKEND_BEARER_TOKEN is required. Generate a random token (e.g. openssl rand -hex 32) and add it to .env.}
      - BACKEND_TIMEOUT_SECONDS=10
      - RAG_TOP_K=3
      - AGNO_ENABLED=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - backend-marazul
    stdin_open: true
    tty: true
    networks:
      - default

  db-marazul:
    image: postgres:16
    container_name: marazul-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required. Copy .env.compose.example to .env and set a value.}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.compose.example to .env and set a value.}
      POSTGRES_DB: ${DB_NAME:-portal_hotel}
    volumes:
      - pgdata-marazul-admin:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped

  pgadmin-marazul:
    image: dpage/pgadmin4:8
    container_name: marazul-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - db-marazul
    networks:
      - default
    restart: unless-stopped

volumes:
  pgdata-marazul-admin:

networks:
  default:
    driver: bridge
