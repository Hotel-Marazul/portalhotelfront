services:
  frontend-marazul:
    image: node:22-slim
    container_name: frontend-marazul
    working_dir: /app/frontend
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/frontend/node_modules
      - /app/frontend/.next
    command: sh -c "npm install && npm run dev:docker"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - BACKEND_API_URL=http://backend-marazul:5000
    depends_on:
      - backend-marazul
    stdin_open: true
    tty: true
    networks:
      - default

  backend-marazul:
    image: node:22-slim
    container_name: backend-marazul
    working_dir: /app/backend
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/backend/node_modules
    command: sh -c "npm install && npm run dev"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - AUTH_COOKIE_NAME=auth_token
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      - DB_HOST=db-marazul
      - DB_PORT=5432
      - DB_NAME=portal_hotel
      - DB_USER=${DB_USER:?DB_USER is required. Copy .env.compose.example to .env and set a value.}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.compose.example to .env and set a value.}
      - AGENTS_SERVICE_TOKEN=${BACKEND_BEARER_TOKEN:?BACKEND_BEARER_TOKEN is required. Generate a random token and add it to .env.}
      - AGENTS_API_URL=http://agents-marazul:5050
      - AGENTS_API_KEY=${AGENTS_API_KEY:?AGENTS_API_KEY is required. Generate a random token and add it to .env.}
    depends_on:
      - db-marazul
    stdin_open: true
    tty: true
    networks:
      - default

  agents-marazul:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: agents-marazul
    working_dir: /app/agents
    ports:
      - "5051:5050"
    volumes:
      - ./agents:/app/agents
    command: sh -c "python -m app.server"
    environment:
      - NODE_ENV=development
      - AGENTS_PORT=5050
      - BACKEND_BASE_URL=http://backend-marazul:5000/api
      - BACKEND_BEARER_TOKEN=${BACKEND_BEARER_TOKEN:?BACKEND_BEARER_TOKEN is required. Generate a random token (e.g. openssl rand -hex 32) and add it to .env.}
      - AGENTS_API_KEY=${AGENTS_API_KEY:?AGENTS_API_KEY is required. Generate a random token and add it to .env.}
      - BACKEND_TIMEOUT_SECONDS=10
      - AGENTS_MUTATIONS_ENABLED=${AGENTS_MUTATIONS_ENABLED:-true}
      - RAG_TOP_K=3
      - AGNO_ENABLED=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      - backend-marazul
    stdin_open: true
    tty: true
    networks:
      - default

  evolution-marazul:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-marazul
    ports:
      - "127.0.0.1:${EVOLUTION_HOST_PORT:-8080}:8080"
    environment:
      SERVER_URL: "http://localhost:${EVOLUTION_HOST_PORT:-8080}"
      SERVER_PORT: "8080"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${EVOLUTION_DB_USER:?EVOLUTION_DB_USER is required.}:${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD is required.}@db-marazul:5432/evolution?schema=evolution_api"
      DATABASE_CONNECTION_CLIENT_NAME: evolution-marazul
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      RABBITMQ_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CACHE_LOCAL_TTL: "86400"
      S3_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY is required.}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LANGUAGE: pt-BR
    volumes:
      - evolution-instances-marazul:/evolution/instances
    depends_on:
      db-marazul:
        condition: service_healthy
    networks:
      - default

  db-marazul:
    image: postgres:16
    container_name: marazul-db
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required. Copy .env.compose.example to .env and set a value.}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.compose.example to .env and set a value.}
      POSTGRES_DB: ${DB_NAME:-portal_hotel}
      EVOLUTION_DB_USER: ${EVOLUTION_DB_USER:?EVOLUTION_DB_USER is required.}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?EVOLUTION_DB_PASSWORD is required.}
    volumes:
      - pgdata-marazul-admin:/var/lib/postgresql/data
      - ./docker/postgres/init/10-evolution.sh:/docker-entrypoint-initdb.d/10-evolution.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - default
    restart: unless-stopped

  pgadmin-marazul:
    image: dpage/pgadmin4:8
    container_name: marazul-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - db-marazul
    networks:
      - default
    restart: unless-stopped

volumes:
  pgdata-marazul-admin:
  evolution-instances-marazul:

networks:
  default:
    driver: bridge
