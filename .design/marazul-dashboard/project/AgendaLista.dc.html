<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Marazul · Agenda em lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F5}
a{color:#1C1D1F}a:hover{color:#2F6B70}
</style>
</helmet>
<div style="height: 100vh; min-height: 820px; display: flex; flex-wrap: wrap; background: #F7F7F5; color: #1C1D1F; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 14px">

  <aside style="flex: 1 1 216px; max-width: 100%; display: flex; flex-direction: column; gap: 24px; padding: 20px 12px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px">
      <span style="width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: #1C1D1F; color: #FFFFFF; font-size: 13px; font-weight: 600">m</span>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em">Marazul</span>
    </div>
    <nav aria-label="Navegação principal" style="display: flex; flex-direction: column; gap: 1px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 10px; border-radius: 8px; text-decoration: none; {{n.style}}">
          {{n.label}}<span style="margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 12px; color: #2F6B70">{{n.badge}}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px">
      <span style="width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #E4E7E5; font-size: 11px; font-weight: 600">RM</span>
      <span style="display: flex; flex-direction: column; font-size: 13px"><span style="font-weight: 500">Rafael Mota</span><span style="color: #6B6F73">Recepção</span></span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; height: 100%; padding: 8px 8px 8px 0; box-sizing: border-box; display: flex">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 22px 28px; background: #FFFFFF; border: 1px solid #E8E8E4; border-radius: 14px; overflow: hidden">

      <header style="flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
          <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Agenda</h1>
          <div role="tablist" aria-label="Visão da agenda" style="display: inline-flex; padding: 3px; border-radius: 9px; background: #F1F1EE">
            <a href="Agenda.dc.html" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 7px; text-decoration: none; font-size: 13px; color: #50555A">Mapa</a>
            <a href="#" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 7px; background: #FFFFFF; box-shadow: 0 1px 2px rgb(0 0 0 / 8%); text-decoration: none; font-size: 13px; font-weight: 500">Lista</a>
          </div>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border: 1px solid #E2E2DE; border-radius: 8px; background: #FFFFFF; cursor: pointer; font: inherit; font-weight: 500">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
            Exportar
          </button>
          <a href="NovaReserva.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 8px; background: #1C1D1F; color: #FFFFFF; text-decoration: none; font-weight: 500">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            Nova reserva
          </a>
        </div>
      </header>

      <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
        <label for="busca-lista" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar reserva</label>
        <div style="display: flex; align-items: center; gap: 8px; width: 280px; height: 36px; padding: 0 12px; box-sizing: border-box; border: 1px solid #E2E2DE; border-radius: 8px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6F73" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="busca-lista" type="text" placeholder="Hóspede, código ou quarto" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 13px">
        </div>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid #E2E2DE; border-radius: 8px; background: #FFFFFF; cursor: pointer; font: inherit; font-size: 13px">Entrada: 27 out – 9 nov <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6F73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <span style="width: 1px; height: 22px; background: #E8E8E4; margin: 0 4px"></span>
        <div role="group" aria-label="Filtrar por status" style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{chips}}" as="s" hint-placeholder-count="5">
            <button type="button" aria-pressed="{{s.ativo}}" onClick="{{s.pick}}" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; cursor: pointer; font: inherit; font-size: 13px; {{s.style}}"><span style="width: 8px; height: 8px; border-radius: 2px; {{s.swatch}}"></span>{{s.label}} <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #6B6F73">{{s.total}}</span></button>
          </sc-for>
        </div>
      </div>

      <div style="flex: 1; min-height: 0; overflow: auto; border-top: 1px solid #EEEEEA">
        <table style="width: 100%; border-collapse: collapse">
          <thead>
            <tr>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; text-align: left; padding: 10px 0; font-size: 12px; font-weight: 500; color: #6B6F73">Código</th>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; text-align: left; padding: 10px 0; font-size: 12px; font-weight: 500; color: #6B6F73">Hóspede</th>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; text-align: left; padding: 10px 0; font-size: 12px; font-weight: 500; color: #6B6F73">Quarto</th>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; text-align: left; padding: 10px 0; font-size: 12px; font-weight: 500; color: #6B6F73">Período</th>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; text-align: left; padding: 10px 0; font-size: 12px; font-weight: 500; color: #6B6F73">Status</th>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; text-align: right; padding: 10px 0; font-size: 12px; font-weight: 500; color: #6B6F73">Total</th>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; text-align: right; padding: 10px 0; font-size: 12px; font-weight: 500; color: #6B6F73">Saldo</th>
              <th scope="col" style="position: sticky; top: 0; z-index: 1; background: #FFFFFF; padding: 10px 0"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ação</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{linhas}}" as="r" hint-placeholder-count="12">
              <tr style="border-top: 1px solid #EEEEEA">
                <td style="padding: 10px 0; font-family: 'Geist Mono', monospace; font-size: 13px; color: #50555A">{{r.codigo}}</td>
                <td style="padding: 10px 0"><span style="display: flex; flex-direction: column"><span style="font-weight: 500">{{r.nome}}</span><span style="font-size: 12px; color: #6B6F73">{{r.pessoas}}</span></span></td>
                <td style="padding: 10px 0"><span style="display: flex; flex-direction: column"><span style="font-family: 'Geist Mono', monospace; font-size: 13px">{{r.quarto}}</span><span style="font-size: 12px; color: #6B6F73">{{r.cat}}</span></span></td>
                <td style="padding: 10px 0"><span style="display: flex; flex-direction: column"><span>{{r.periodo}}</span><span style="font-size: 12px; color: #6B6F73">{{r.noites}}</span></span></td>
                <td style="padding: 10px 0"><span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; {{r.chip}}">{{r.status}}</span></td>
                <td style="padding: 10px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 13px">{{r.total}}</td>
                <td style="padding: 10px 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 13px; color: {{r.saldoCor}}">{{r.saldo}}</td>
                <td style="padding: 10px 0 10px 16px; text-align: right"><a href="Reserva.dc.html" style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border: 1px solid #E2E2DE; border-radius: 7px; text-decoration: none; font-size: 13px; font-weight: 500">Abrir</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: #6B6F73">
        <span>{{rodape}}</span>
        <span style="display: inline-flex; gap: 4px">
          <button type="button" aria-label="Página anterior" style="width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #E2E2DE; border-radius: 7px; background: #FFFFFF; color: #50555A; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Próxima página" style="width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid #E2E2DE; border-radius: 7px; background: #FFFFFF; color: #50555A; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
        </span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filtros: { Pendente: true, Confirmada: true, EmAndamento: true, Concluida: false, Cancelada: false } };
  }
  renderVals() {
    const ST = {
      Pendente: { label: 'Pendente', chip: 'background: #F4E6CC; color: #7A4508;', swatch: 'background: #F4E6CC; box-shadow: inset 0 0 0 1px #E6CFA3;' },
      Confirmada: { label: 'Confirmada', chip: 'background: #E3EFED; color: #1F4F53;', swatch: 'background: #2F6B70;' },
      EmAndamento: { label: 'Hospedado', chip: 'background: #1C1D1F; color: #FFFFFF;', swatch: 'background: #1C1D1F;' },
      Concluida: { label: 'Concluída', chip: 'background: #ECECE8; color: #5C6064;', swatch: 'background: #ECECE8;' },
      Cancelada: { label: 'Cancelada', chip: 'background: #FCE8E6; color: #B42318;', swatch: 'background: #FCE8E6; box-shadow: inset 0 0 0 1px #F0C4BE;' }
    };
    const R = [
      ['A3F9C21B', 'Mariana Carvalho', '2 pessoas', '103', 'Luxo', '25 → 30 out', 5, 'EmAndamento', 2240, 1240, true],
      ['7D02E4A1', 'Carlos Souza', '2 pessoas', '106', 'Standard', '24 → 28 out', 4, 'EmAndamento', 1892, 0],
      ['C81B0F3E', 'Eduardo Santos', '4 pessoas', '201', 'Super Luxo', '26 → 31 out', 5, 'EmAndamento', 3140, 0],
      ['19E6A7D4', 'Júlia Menezes', '1 pessoa', '102', 'Standard', '27 out → 2 nov', 6, 'Confirmada', 2838, 960],
      ['5B4C3F20', 'Paulo Nunes', '2 pessoas', '108', 'Standard', '27 out → 1 nov', 5, 'Confirmada', 2365, 0],
      ['E0A9B812', 'Ana Freitas', '2 pessoas', '104', 'Luxo', '27 → 31 out', 4, 'Confirmada', 1980, 0],
      ['2F7D61C9', 'Lucas Barbosa', '4 pessoas', '202', 'Super Luxo', '27 out → 1 nov', 5, 'Confirmada', 2840, 0],
      ['8C35E07A', 'Fernanda Lima', '2 pessoas', '106', 'Standard', '28 out → 1 nov', 4, 'Confirmada', 1892, 0],
      ['D4B120E6', 'Roberto Ramos', '4 pessoas', '203', 'Super Luxo', '29 out → 5 nov', 7, 'Confirmada', 4096, 2048],
      ['61FA9C3B', 'Clara Teixeira', '2 pessoas', '110', 'Standard', '29 out → 3 nov', 5, 'Pendente', 2365, 2365],
      ['A07E5D29', 'Helena Rocha', '1 pessoa', '106', 'Standard', '1 → 5 nov', 4, 'Pendente', 1892, 1892],
      ['3E92C6F1', 'Beatriz Martins', '2 pessoas', '202', 'Super Luxo', '2 → 6 nov', 4, 'Confirmada', 1892, 0],
      ['B5D8A044', 'Tiago Costa', '2 pessoas', '104', 'Luxo', '23 → 27 out', 4, 'Concluida', 1980, 0],
      ['4C1E7B90', 'Rita Moreira', '2 pessoas', '105', 'Luxo', '23 → 27 out', 4, 'Concluida', 1980, 0],
      ['F2A6D37C', 'Igor Peixoto', '2 pessoas', '109', 'Simples', '30 out → 2 nov', 3, 'Cancelada', 1320, 0]
    ];
    const brl = (v) => 'R$ ' + v.toLocaleString('pt-BR');
    const f = this.state.filtros;
    const visiveis = R.filter((r) => f[r[7]]);
    const linhas = visiveis.map(([codigo, nome, pessoas, quarto, cat, periodo, n, status, total, saldo, vencido]) => ({
      codigo, nome, pessoas, quarto, cat, periodo, noites: n + (n === 1 ? ' noite' : ' noites'),
      status: ST[status].label, chip: ST[status].chip, total: brl(total),
      saldo: status === 'Cancelada' ? '—' : saldo ? brl(saldo) + (vencido ? ' vencido' : '') : 'quitado',
      saldoCor: vencido ? '#B42318' : saldo ? '#A15C07' : '#6B6F73'
    }));
    const chips = Object.keys(ST).map((k) => {
      const on = !!f[k];
      return { label: ST[k].label, swatch: ST[k].swatch, total: String(R.filter((r) => r[7] === k).length), ativo: on ? 'true' : 'false',
        style: on ? 'border: 1px solid #1C1D1F; background: #FFFFFF; color: #1C1D1F;' : 'border: 1px solid #E2E2DE; background: #FFFFFF; color: #6B6F73;',
        pick: () => this.setState({ filtros: Object.assign({}, f, { [k]: !on }) }) };
    });
    const nav = [['Hoje','Main.dc.html',''],['Agenda','#',''],['Hóspedes','Hospedes.dc.html',''],['Quartos','Quartos.dc.html',''],['Tarifas','Tarifas.dc.html',''],['WhatsApp','Whatsapp.dc.html','5']].map(([label, href, badge], i) => ({
      label, href, badge, current: i === 1 ? 'page' : 'false',
      style: i === 1 ? 'background: #EBEBE7; color: #1C1D1F; font-weight: 500;' : 'color: #50555A;'
    }));
    return { nav, chips, linhas, rodape: visiveis.length + ' reservas com entrada entre 27 out e 9 nov · concluídas e canceladas escondidas por padrão' };
  }
}
</script>
</body>
</html>
