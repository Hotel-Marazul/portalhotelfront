schema: spec-driven

context: |
  Language: Português (Brasil)
  All artifacts must be written in Português (Brasil).
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Cada tarefa vira um commit no master, com a tarefa marcada no tasks.md no mesmo commit.
      - "Antes de commitar, `node scripts/openspec-audit.mjs <change>` não pode ter FALHA."
  archive:
    guidance:
      - "Antes de arquivar, a change precisa de verification.md APROVADA (skill openspec-verify)."
      - "Rode `node scripts/openspec-audit.mjs <change>` e resolva os avisos ou registre-os no verification.md."
